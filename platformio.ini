; ⬡ PADEL SCORE — PlatformIO Configuration
;
; Build & Upload:
;   pio run --target upload          # Flash firmware
;   pio run --target uploadfs        # Upload HTML files to LittleFS
;
; Or use Arduino IDE:
;   1. Install ESP32 board support
;   2. Install libraries: ESPAsyncWebServer, AsyncTCP, ArduinoJson
;   3. Tools → ESP32 Sketch Data Upload (for /data folder)

[env:esp32]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

; Libraries — me-no-dev originals work with ESP32 Arduino core 2.x
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.0.0

; LittleFS for file storage
board_build.filesystem = littlefs

; Partition scheme with enough space for LittleFS
; default_8MB or default works for most boards
; For 4MB flash ESP32, use:
board_build.partitions = default.csv

; Upload speed
upload_speed = 921600

; Optional: OTA updates (uncomment if desired)
; upload_protocol = espota
; upload_port = 192.168.4.1

; ===== ESP32-C3 variant =====
; Build:  pio run -e esp32c3 --target upload
; Upload: pio run -e esp32c3 --target uploadfs
[env:esp32c3]
platform = espressif32 @ 6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

; mathieucarbou's fork supports ESP32-C3 (bundles AsyncTCP for RISC-V)
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.0.0

board_build.filesystem = littlefs
board_build.partitions = default.csv
upload_speed = 921600

